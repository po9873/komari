[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid

; 给 supervisorctl 用：docker exec komari supervisorctl status
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:komari]
command=/app/komari server
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; 证书签发 / 续期。域名自动识别（已有证书 CN / CF 隧道日志），没有就等；
; KOMARI_ACME_ENABLED=0 时立刻正常退出。
[program:acme]
command=/usr/local/bin/acme-renew.sh
autostart=true
autorestart=unexpected
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; cloudflared 的输出同时 tee 一份到文件：acme 要从里面读 CF 后台配的 hostname，
; 不然容器里没有任何地方能看到隧道配置。docker logs 照旧有（tee 不吞输出）。
[program:cloudflared]
command=/bin/sh -c '/usr/local/bin/cloudflared tunnel --no-autoupdate --protocol http2 --edge-ip-version 4 --grace-period 30s run 2>&1 | tee -a /var/log/cloudflared.log'
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
environment=TUNNEL_TOKEN=%(ENV_TUNNEL_TOKEN)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
