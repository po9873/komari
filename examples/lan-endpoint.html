<!--
  局域网端点上报表（内网上报）

  用法：面板 → 设置 → 自定义美化 → 自定义 Body，把下面整段脚本（含标签）粘进去保存。
  不需要改任何值：第一次勾选「局域网设备（内网上报）」时，会弹框让你填一次内网地址，
  之后存在浏览器 localStorage 里，双击那个勾选框可以随时改。

  效果：节点「一键部署指令」弹窗里多一个「局域网设备（内网上报）」勾选；
  勾上时生成的命令、以及复制到剪贴板的内容，都会把公网域名换成内网地址。
-->

<script>
(function () {
  'use strict';

  var KEY_ON = 'komari_lan_ep_on';   // 勾选状态
  var KEY_EP = 'komari_lan_ep';      // 内网地址
  var WAN = location.origin;         // 当前访问地址，外网访问时就是公网域名

  function get(k) {
    try { return localStorage.getItem(k) || ''; } catch (e) { return ''; }
  }
  function put(k, v) {
    try { localStorage.setItem(k, v); } catch (e) {}
  }

  function enabled() { return get(KEY_ON) === '1'; }
  function endpoint() { return get(KEY_EP); }

  // 弹框填内网地址，留空或取消则返回 false
  function askEndpoint() {
    var def = endpoint() || location.origin;
    var v = window.prompt(
      '内网访问地址（内网设备实际访问面板用的地址，按你自己的填）',
      def
    );
    if (v === null) return !!endpoint();
    v = (v || '').trim().replace(/\/+$/, '');
    if (!v) return !!endpoint();
    if (!/^https?:\/\//i.test(v)) v = 'http://' + v;
    put(KEY_EP, v);
    return true;
  }

  function rewrite(s) {
    if (typeof s !== 'string') return s;
    var lan = endpoint();
    if (!lan) return s;
    return enabled() ? s.split(WAN).join(lan) : s.split(lan).join(WAN);
  }

  function hit(s) {
    if (typeof s !== 'string' || !s) return false;
    if (s.indexOf(WAN) !== -1) return true;
    var lan = endpoint();
    return !!lan && s.indexOf(lan) !== -1;
  }

  function looksLikeCommand(text) {
    return /install\.sh|install\.ps1|sudo bash|KOMARI_ENDPOINT|komari-agent/i.test(text || '');
  }

  function walk(node) {
    if (node.nodeType === 3) {
      var v = node.nodeValue;
      if (!hit(v)) return;
      var root = node.parentElement;
      var ctx = (root ? root.textContent : '') || '';
      if (looksLikeCommand(ctx) || looksLikeCommand(v)) {
        var nv = rewrite(v);
        if (nv !== v) node.nodeValue = nv;
      }
      return;
    }
    if (node.nodeType !== 1) return;
    if (node.tagName === 'SCRIPT' || node.tagName === 'STYLE') return;
    for (var i = 0; i < node.childNodes.length; i++) walk(node.childNodes[i]);
  }

  function hookClipboard() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      var orig = navigator.clipboard.writeText.bind(navigator.clipboard);
      navigator.clipboard.writeText = function (t) {
        return orig(typeof t === 'string' ? rewrite(t) : t);
      };
    }
    document.addEventListener('copy', function (e) {
      try {
        var t = e.clipboardData ? e.clipboardData.getData('text/plain') : '';
        if (hit(t)) {
          e.clipboardData.setData('text/plain', rewrite(t));
          e.preventDefault();
        }
      } catch (err) {}
    }, true);
  }

  function syncTitle(label) {
    var ep = endpoint();
    label.title = '双击可修改内网地址' + (ep ? '\n当前：' + ep : '\n还没设置，勾选时会让你填');
  }

  function injectCheckbox() {
    var exist = document.getElementById('kmt-lan-label');
    if (exist) { syncTitle(exist); return true; }

    var all = document.querySelectorAll('label,span,div');
    var anchor = null;
    for (var i = 0; i < all.length; i++) {
      var t = (all[i].textContent || '').trim();
      if ((t === '禁用远程控制' || t === 'Disable remote control') && all[i].offsetParent !== null) {
        anchor = all[i].closest('label') || all[i];
        break;
      }
    }

    var grid = null;
    if (anchor) {
      grid = anchor.parentElement && anchor.parentElement.parentElement;
      if (!grid || grid === document.body) grid = anchor.parentElement;
    }

    var label = document.createElement('label');
    label.id = 'kmt-lan-label';
    label.style.cssText = 'display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;white-space:nowrap;';

    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.id = 'kmt-lan-cb';
    cb.checked = enabled();
    cb.style.cssText = 'width:14px;height:14px;cursor:pointer;';

    var span = document.createElement('span');
    span.textContent = '局域网设备（内网上报）';
    span.style.cssText = 'font-size:13px;';

    label.appendChild(cb);
    label.appendChild(span);

    if (grid && grid !== document.body) {
      if (anchor) {
        var cs = getComputedStyle(anchor);
        label.style.fontSize = cs.fontSize;
        label.style.color = cs.color;
        if (cs.display.indexOf('flex') !== -1) label.style.display = cs.display;
      }
      grid.appendChild(label);
    } else {
      label.style.cssText += 'position:fixed;right:16px;bottom:16px;z-index:99999;' +
        'background:#1c1633;color:#e8e2ff;padding:8px 14px;border-radius:999px;' +
        'border:1px solid #5b4a8a;box-shadow:0 4px 16px rgba(0,0,0,.4);';
      document.body.appendChild(label);
    }

    cb.addEventListener('change', function () {
      if (cb.checked && !endpoint()) {
        if (!askEndpoint()) { cb.checked = false; put(KEY_ON, '0'); return; }
      }
      put(KEY_ON, cb.checked ? '1' : '0');
      syncTitle(label);
      scan();
    });

    label.addEventListener('dblclick', function (e) {
      e.preventDefault();
      if (askEndpoint()) { syncTitle(label); scan(); }
    });

    syncTitle(label);
    return true;
  }

  var scanning = false;
  function scan() {
    if (scanning) return;
    scanning = true;
    try {
      var txt = document.body && document.body.textContent;
      if (!txt) return;
      var hasCmd = txt.indexOf('install.sh') !== -1 ||
                   txt.indexOf('install.ps1') !== -1 ||
                   txt.indexOf('komari-agent') !== -1;
      if (!hasCmd) return;
      injectCheckbox();
      var cb = document.getElementById('kmt-lan-cb');
      if (cb && cb.checked !== enabled()) cb.checked = enabled();
      walk(document.body);
    } finally {
      scanning = false;
    }
  }

  hookClipboard();

  var mo = new MutationObserver(function () { scan(); });
  function start() {
    if (document.body) {
      mo.observe(document.body, { childList: true, subtree: true, characterData: true });
      scan();
    } else {
      setTimeout(start, 300);
    }
  }
  start();
})();
</script>
